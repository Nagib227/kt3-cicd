stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: kind-registry:5000
  IMAGE_REPO: campus-api

test:
  stage: test
  image: mirror.gcr.io/library/python:3.13-slim
  timeout: 10m
  script:
    - python -m unittest -v test_app.py

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  timeout: 25m
  script:
    - mkdir -p /kaniko/.docker
    - echo '{"insecureRegistries":["kind-registry:5000"]}' > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$REGISTRY/$IMAGE_REPO:$CI_COMMIT_SHA" --digest-file "$CI_PROJECT_DIR/digest.txt" --insecure-registry "$REGISTRY" --skip-tls-verify-registry "$REGISTRY" --build-arg "APP_VERSION=$CI_COMMIT_SHORT_SHA" --verbosity info
  artifacts:
    paths:
      - digest.txt
    expire_in: 1 day

deploy:
  stage: deploy
  image: mirror.gcr.io/library/python:3.13-slim
  timeout: 10m
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates
    - curl -fsSL -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl
    - chmod +x /usr/local/bin/kubectl
    - sed "s/REPLACE_SHA/${CI_COMMIT_SHA}/g" k8s/deployment.yaml | kubectl apply -f -
    - kubectl apply -f k8s/service.yaml
    - kubectl set image deployment/campus-api api="localhost:5001/campus-api:${CI_COMMIT_SHA}" -n campus-board
    - kubectl rollout status deployment/campus-api -n campus-board --timeout=180s
    - kubectl get deployment campus-api -n campus-board -o jsonpath="{.spec.template.spec.containers[0].image}"
    - echo
