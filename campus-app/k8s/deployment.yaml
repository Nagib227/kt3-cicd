apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-api
  namespace: campus-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-api
  template:
    metadata:
      labels:
        app: campus-api
    spec:
      containers:
        - name: api
          image: localhost:5001/campus-api:REPLACE_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: READY
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
