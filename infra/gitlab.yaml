apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:17.11.7-ce.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: gitlab-omnibus-config
                  key: config
          ports:
            - name: http
              containerPort: 8929
          readinessProbe:
            exec:
              command:
                - curl
                - -fsS
                - -o
                - /dev/null
                - http://127.0.0.1:8929/-/readiness
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - curl
                - -fsS
                - -o
                - /dev/null
                - http://127.0.0.1:8929/-/readiness
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 40
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/opt/gitlab
            - name: config
              mountPath: /etc/gitlab
            - name: logs
              mountPath: /var/log/gitlab
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          hostPath:
            path: /var/gitlab-data
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: /var/gitlab-config
            type: DirectoryOrCreate
        - name: logs
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - name: http
      port: 8929
      targetPort: http
